spring.application.name=task
spring.datasource.url=jdbc:sqlite:./data/transactions.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=when_authorized
server.port=8081
logging.level.org.springframework.security=DEBUG
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA busy_timeout=10000; PRAGMA synchronous=NORMAL;
spring.task.scheduling.pool.size=3
posting.service.url=http://localhost:8080
posting.service.connect-timeout-ms=5000
posting.service.read-timeout-ms=15000